[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "log-analytics-pipeline"
version = "0.1.0"
description = "Nginx / JSON access-log analytics: parsing, enrichment, DuckDB storage, percentiles, anomaly alerts, follow mode and HTML reports"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Akib Jafor" }]
dependencies = [
    "duckdb>=1.0",
    "typer>=0.12",
    "rich>=13",
]

[project.optional-dependencies]
api = ["fastapi>=0.110,<0.116", "uvicorn>=0.29"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "fastapi>=0.110,<0.116",
    "ruff>=0.4",
]

[project.scripts]
logpipe = "logpipe.cli:app"

[tool.setuptools.packages.find]
include = ["logpipe*"]

[tool.setuptools.package-data]
logpipe = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["logpipe", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"logpipe/generator.py" = ["E501"]  # long user-agent strings and log line templates
"logpipe/report.py" = ["E501"]     # inline SVG/HTML templates

[tool.ruff.lint.isort]
known-first-party = ["logpipe"]

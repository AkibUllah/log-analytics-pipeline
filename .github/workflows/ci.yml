name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest -q
      - name: Smoke-test the CLI
        run: |
          logpipe generate-sample --lines 5000 --minutes 240 --out /tmp/access.log
          logpipe ingest /tmp/access.log --db /tmp/ci.duckdb --no-checkpoint
          logpipe report --db /tmp/ci.duckdb --since 2h --html /tmp/report.html
          test -s /tmp/report.html

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t log-analytics-pipeline:ci .
